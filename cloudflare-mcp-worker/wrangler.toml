name = "cloudflare-mcp-toolkit"
main = "src/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "STORAGE_KV"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "STORAGE_R2"
bucket_name = "mcp-bucket"

[[d1_databases]]
binding = "DB"
database_name = "mcp-db"
database_id = "YOUR_D1_DATABASE_ID"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "mcp-vector-index"

[vars]
AUTH_TOKEN = "CHANGEME_MCP_SECRET_TOKEN"
